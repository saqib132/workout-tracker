<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Workout Tracker</title>
<meta name="theme-color" content="#14181c" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <h1>Workout Tracker</h1>
</header>

<main id="view-home" class="view">
  <section class="card week-stat-card">
    <span class="stat-label">This week</span>
    <span class="stat-value" id="weekStat">0 workouts</span>
  </section>
  <section class="card">
    <div class="card-head-row">
      <h2>Your routines</h2>
      <button id="recordsBtn" class="link-btn">&#127942; Records</button>
    </div>
    <div id="routineList" class="list"></div>
    <button id="newRoutineBtn" class="fab">+ New routine</button>
  </section>
  <section class="card">
    <div class="card-head-row">
      <h2>Recent workouts</h2>
      <button id="seeAllHistoryBtn" class="link-btn">See all</button>
    </div>
    <div id="recentWorkouts" class="list"></div>
  </section>
</main>

<main id="view-nutrition" class="view hidden">
  <section class="card">
    <h2>Today</h2>
    <div class="stat-row">
      <div class="stat"><span class="stat-label">Eaten</span><span class="stat-value" id="nutEaten">0</span></div>
      <div class="stat"><span class="stat-label">Maintenance</span><span class="stat-value" id="nutMaintenance">-</span></div>
      <div class="stat"><span class="stat-label">Balance</span><span class="stat-value" id="nutBalance">-</span></div>
    </div>
  </section>
  <section class="card">
    <h2>Food log</h2>
    <div id="foodList" class="list"></div>
    <button id="addFoodBtn" class="btn">+ Add food / calories</button>
  </section>
</main>

<main id="view-profile" class="view hidden">
  <section class="card">
    <h2>Your stats</h2>
    <label>Weight (kg)<input type="number" id="pfWeight" step="0.1" /></label>
    <label>Height (cm)<input type="number" id="pfHeight" step="0.1" /></label>
    <label>Age<input type="number" id="pfAge" step="1" /></label>
    <label>Gender
      <select id="pfGender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </label>
    <label>Activity level
      <select id="pfActivity">
        <option value="1.2">Sedentary (little to no exercise)</option>
        <option value="1.375">Light (1-3 days/week)</option>
        <option value="1.55">Moderate (3-5 days/week)</option>
        <option value="1.725">Active (6-7 days/week)</option>
        <option value="1.9">Very active (hard training daily)</option>
      </select>
    </label>
    <button id="saveProfileBtn" class="btn">Save</button>
  </section>
  <section class="card">
    <h2>Results</h2>
    <div class="stat-row">
      <div class="stat"><span class="stat-label">BMI</span><span class="stat-value" id="pfBmi">-</span></div>
      <div class="stat"><span class="stat-label">BMR</span><span class="stat-value" id="pfBmr">-</span></div>
      <div class="stat"><span class="stat-label">Maintenance</span><span class="stat-value" id="pfMaintenance">-</span></div>
    </div>
    <p class="hint" id="pfBmiLabel"></p>
  </section>
  <section class="card">
    <h2>Backup</h2>
    <p class="hint">Your data lives only on this phone. Export a backup now and then in case Safari ever clears site data.</p>
    <button id="exportBtn" class="btn">Export backup</button>
    <button id="importBtn" class="btn secondary">Import backup</button>
    <input type="file" id="importFile" accept="application/json" class="hidden" />
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="home">Home</button>
  <button class="tab" data-view="nutrition">Nutrition</button>
  <button class="tab" data-view="profile">Profile</button>
</nav>

<!-- Add food modal -->
<div id="addFoodModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h2>Add food</h2>
      <button class="close" data-close="addFoodModal">Close</button>
    </div>
    <label>Description<input type="text" id="newFoodDesc" placeholder="e.g. Chicken + rice bowl" /></label>
    <label>Calories<input type="number" id="newFoodCal" step="1" /></label>
    <button id="saveFoodBtn" class="btn">Add</button>
  </div>
</div>

<!-- Full-screen page overlays (routine builder, session, history, exercise detail) -->
<div id="pageLayer"></div>

<script src="pictograms.js"></script>
<script src="exercise-info.js"></script>
<script src="exercise-photos.js"></script>
<script src="app.js"></script>
</body>
</html>
